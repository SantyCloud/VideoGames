<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestra Partida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;700&family=VT323&display=swap">
<style>
:root{
  --bg:#FFE3EE; --bg2:#FFD0E3; --panel:#FFF7FB; --ink:#5B2A4A; --ink2:#8A5577;
  --accent:#FF6FA8; --accent2:#FF9CC5; --mint:#A8E6CF; --butter:#FFE59A; --lilac:#CDB4FF; --sky:#BFE3FF;
  --display:"Press Start 2P", ui-monospace, monospace;
  --body:"Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --mono:"VT323", ui-monospace, monospace;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(var(--bg2) 1.5px, transparent 1.6px);background-size:22px 22px;
  padding-inline:16px;padding-block:16px 40px;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}

.console{max-width:880px;margin:0 auto;background:var(--panel);border:4px solid var(--ink);border-radius:18px;
  box-shadow:0 8px 0 var(--ink), 0 8px 0 4px var(--accent2);position:relative;overflow:hidden}
.topbar{display:flex;justify-content:center;align-items:center;gap:10px;padding:12px 12px 10px;background:var(--accent2);border-bottom:4px solid var(--ink);flex-wrap:wrap}
.pill{font-family:var(--display);font-size:10px;letter-spacing:.06em;background:var(--panel);border:3px solid var(--ink);padding:8px 12px;border-radius:999px;text-transform:uppercase;white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
.topbar canvas.heart{width:28px;height:24px;image-rendering:pixelated}
.screen{padding:22px 18px 26px;min-height:420px;position:relative}
.screen-title{font-family:var(--display);font-size:clamp(13px,3.2vw,18px);line-height:1.6;margin:0 0 6px;text-wrap:balance}
.lead{margin:0 0 18px;color:var(--ink2)}
.back{font-family:var(--display);font-size:10px;background:none;border:3px solid var(--ink);border-radius:10px;padding:8px 10px;margin-bottom:16px;background:var(--panel)}
.back:hover{background:var(--butter)}

/* title screen */
#s-title{background:linear-gradient(180deg,#FFD6E8 0%, #FFE9F2 60%, #FFF7FB 100%);overflow:hidden}
.clouds{position:absolute;inset:0;pointer-events:none}
.cloud{position:absolute;width:96px;height:24px;background:#fff;opacity:.9;
  box-shadow:16px -12px 0 #fff, 40px -12px 0 #fff, 56px -24px 0 #fff, 24px -24px 0 #fff;animation:drift 38s linear infinite}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(980px)}}
.sparkle{position:absolute;font-family:var(--mono);color:#fff;font-size:26px;text-shadow:0 0 2px var(--accent2);animation:twinkle 2.4s steps(2) infinite}
@keyframes twinkle{50%{opacity:.2}}
.title-wrap{position:relative;display:grid;justify-items:center;text-align:center;gap:16px;padding-top:18px}
.logo-small{font-family:var(--mono);font-size:22px;color:var(--ink2);letter-spacing:.08em}
.logo{font-family:var(--display);font-size:clamp(22px,6.4vw,50px);line-height:1.25;margin:0;color:var(--panel);
  -webkit-text-stroke:0;text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),3px 3px var(--ink),-3px -3px var(--ink),3px -3px var(--ink),-3px 3px var(--ink),6px 7px 0 var(--accent);text-wrap:balance}
.logo em{font-style:normal;color:var(--accent2)}
.start{font-family:var(--display);font-size:14px;background:var(--panel);border:4px solid var(--ink);border-radius:12px;padding:16px 26px;
  box-shadow:0 6px 0 var(--ink);display:inline-flex;gap:12px;align-items:center;transition:transform .08s}
.start:hover{background:var(--butter)}
.start:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.start .tri{width:0;height:0;border-left:12px solid var(--ink);border-top:8px solid transparent;border-bottom:8px solid transparent}
.blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.warning{font-family:var(--mono);font-size:19px;background:var(--ink);color:var(--butter);padding:6px 14px;border-radius:8px;max-width:100%;line-height:1.2}
.sprites{display:flex;justify-content:space-between;align-items:flex-end;width:100%;max-width:560px;margin-top:4px}
.sprites canvas{width:80px;height:112px;image-rendering:pixelated}
.sprites .mid{font-family:var(--mono);font-size:22px;color:var(--ink2);text-align:center}
.arcade{display:flex;gap:12px;justify-content:center;margin-top:6px}
.arcade i{display:block;width:30px;height:18px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.admin-hint{font-family:var(--mono);font-size:19px;background:var(--mint);border:3px solid var(--ink);border-radius:10px;padding:6px 12px;line-height:1.2}

/* menu */
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{border:3px solid var(--ink);border-radius:12px;padding:10px 14px;background:#fff}
.stat .k{font-family:var(--display);font-size:9px;letter-spacing:.08em;color:var(--ink2);text-transform:uppercase}
.stat .v{font-family:var(--mono);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:22px;color:var(--ink2)}
.hp{display:flex;gap:4px;margin-top:6px}
.hp canvas{width:21px;height:18px;image-rendering:pixelated}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.level{text-align:left;border:4px solid var(--ink);border-radius:14px;padding:0;background:#fff;box-shadow:0 5px 0 var(--ink);display:grid;grid-template-columns:64px 1fr;overflow:hidden;transition:transform .08s}
.level:hover{transform:translateY(-2px)}
.level:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.level .num{display:grid;place-items:center;font-family:var(--display);font-size:18px;border-right:4px solid var(--ink)}
.level .txt{padding:12px 14px}
.level .name{font-family:var(--display);font-size:11px;line-height:1.6}
.level .sub{font-size:15px;color:var(--ink2)}
.level .badge{font-family:var(--mono);font-size:17px;margin-top:4px;display:inline-block;background:var(--butter);border:2px solid var(--ink);border-radius:6px;padding:0 6px}
.final-btn{margin-top:18px;width:100%;font-family:var(--display);font-size:12px;border:4px solid var(--ink);border-radius:14px;padding:18px;background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--ink)}
.final-btn[disabled]{background:#eee;color:var(--ink2);cursor:not-allowed}

/* photos */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px;padding:6px}
.polaroid{background:#fff;border:3px solid var(--ink);padding:10px 10px 8px;box-shadow:4px 5px 0 var(--accent2);transform:rotate(var(--r,0deg));transition:transform .15s;border-radius:4px}
.polaroid:hover{transform:rotate(0) scale(1.03)}
.polaroid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border:2px solid var(--ink)}
.polaroid p{margin:8px 0 0;font-family:var(--mono);font-size:20px;line-height:1.1;text-align:center;min-height:22px}
.empty{border:3px dashed var(--ink2);border-radius:14px;padding:26px;text-align:center;color:var(--ink2);font-family:var(--mono);font-size:22px;line-height:1.2}
.lightbox{position:fixed;inset:0;background:rgba(91,42,74,.82);display:grid;place-items:center;z-index:50;padding:20px}
.lightbox figure{margin:0;background:#fff;border:4px solid var(--ink);padding:12px;max-width:min(92vw,720px);border-radius:6px}
.lightbox img{display:block;max-height:70vh;width:auto;margin:0 auto}
.lightbox figcaption{font-family:var(--mono);font-size:24px;text-align:center;margin-top:8px}

/* voices */
.tapes{display:grid;gap:14px}
.tape{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border:4px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--lilac)}
.reels{width:74px;height:44px;border:3px solid var(--ink);border-radius:8px;background:#fff;display:flex;justify-content:space-around;align-items:center}
.reels span{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);background:repeating-conic-gradient(var(--ink) 0 20deg,#fff 20deg 60deg)}
.tape.playing .reels span{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tape .t{font-family:var(--display);font-size:11px;line-height:1.6;word-break:break-word}
.tape .d{font-family:var(--mono);font-size:18px;color:var(--ink2)}
.bar{height:10px;border:2px solid var(--ink);border-radius:6px;background:#fff;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.play{width:52px;height:52px;border:4px solid var(--ink);border-radius:50%;background:var(--butter);font-family:var(--display);font-size:14px;box-shadow:0 4px 0 var(--ink)}

/* letter */
.letter-stage{display:grid;justify-items:center;gap:18px;padding:10px 0}
.envelope{width:min(340px,100%);aspect-ratio:3/2;position:relative;background:var(--accent2);border:4px solid var(--ink);border-radius:8px;cursor:pointer;box-shadow:0 6px 0 var(--ink)}
.envelope::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.5%,var(--ink) 49.5% 50.5%,transparent 50.5%),linear-gradient(to bottom left,transparent 49.5%,var(--ink) 49.5% 50.5%,transparent 50.5%);background-size:50% 100%;background-position:left,right;background-repeat:no-repeat;opacity:.5}
.envelope .seal{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:56px;height:48px;image-rendering:pixelated}
.envelope-label{font-family:var(--display);font-size:11px}
.paper{width:100%;max-width:640px;background:#fff;border:4px solid var(--ink);border-radius:6px;padding:24px 22px;
  background-image:repeating-linear-gradient(transparent 0 33px,#FFD0E3 33px 35px);font-size:19px;line-height:35px;white-space:pre-wrap;min-height:200px}
.paper .sig{display:block;text-align:right;font-family:var(--mono);font-size:26px;margin-top:10px}
.caret{display:inline-block;width:9px;height:20px;background:var(--accent);vertical-align:-3px;animation:blink 1s steps(2) infinite}
.skip{font-family:var(--mono);font-size:20px;background:none;border:none;text-decoration:underline;color:var(--ink2)}

/* reasons */
.capsules{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.capsule{min-height:130px;border:4px solid var(--ink);border-radius:60px 60px 18px 18px;background:linear-gradient(180deg,var(--c) 0 50%,#fff 50%);box-shadow:0 5px 0 var(--ink);padding:14px;display:grid;place-items:center;text-align:center;transition:transform .1s}
.capsule .q{font-family:var(--display);font-size:22px;color:var(--ink)}
.capsule.open{border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--accent)}
.capsule.open .r{font-size:17px;line-height:1.35}
.capsule:not(.open):hover{transform:rotate(-3deg)}
.counter{font-family:var(--mono);font-size:22px;margin-bottom:12px}

/* cake */
.cake-stage{display:grid;justify-items:center;gap:14px;text-align:center}
.cake{position:relative;width:260px;max-width:100%;margin-top:60px}
.candles{position:absolute;left:0;right:0;top:-58px;display:flex;justify-content:center;gap:22px}
.candle{width:16px;height:48px;background:repeating-linear-gradient(180deg,#fff 0 8px,var(--sky) 8px 16px);border:3px solid var(--ink);position:relative;padding:0;border-radius:2px}
.candle .flame{position:absolute;left:50%;top:-24px;width:14px;height:20px;transform:translateX(-50%);background:var(--butter);border:3px solid #FF9A3C;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:flick .5s steps(2) infinite}
.candle.out .flame{display:none}
.candle.out::after{content:"~";position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:22px;color:var(--ink2)}
@keyframes flick{50%{transform:translateX(-50%) scaleY(.85)}}
.tier{border:4px solid var(--ink);border-radius:8px}
.tier.t1{height:44px;margin:0 30px;background:var(--panel);border-bottom-width:2px;background-image:radial-gradient(var(--accent) 3px,transparent 3.5px);background-size:22px 22px;background-position:6px 8px}
.tier.t2{height:70px;background:var(--accent2);background-image:linear-gradient(180deg,#fff 0 12px,transparent 12px),radial-gradient(var(--butter) 3px,transparent 3.5px);background-size:100% 100%,26px 26px;background-position:0 0,8px 26px}
.plate{height:12px;margin:0 -16px;background:var(--lilac);border:4px solid var(--ink);border-radius:0 0 20px 20px;border-top:none}
.bday{font-family:var(--display);font-size:clamp(13px,3.6vw,20px);line-height:1.6;margin:10px 0 0}
.wish{max-width:560px;background:#fff;border:4px solid var(--ink);border-radius:12px;padding:16px 18px;font-size:18px;white-space:pre-wrap}

/* end */
#s-end{text-align:center;display:grid;gap:18px;justify-items:center;background:linear-gradient(180deg,#FFF7FB,#FFD6E8)}
.gc{font-family:var(--display);font-size:clamp(18px,5vw,34px);line-height:1.4;margin:10px 0 0;color:var(--accent);text-shadow:3px 3px 0 var(--ink)}
.finale{max-width:560px;font-size:19px;white-space:pre-wrap}
.dialog{background:#fff;border:4px solid var(--ink);border-radius:6px;max-width:440px;width:100%;box-shadow:0 0 0 4px var(--sky)}
.dialog .bar2{display:flex;justify-content:flex-end;gap:4px;background:var(--sky);border-bottom:4px solid var(--ink);padding:4px}
.dialog .bar2 i{width:16px;height:14px;border:2px solid var(--ink);background:#fff;display:block}
.dialog .body{padding:18px;display:flex;gap:14px;align-items:center;text-align:left;font-family:var(--mono);font-size:24px;line-height:1.1}
.dialog .body canvas{width:56px;height:48px;image-rendering:pixelated;flex:none}
.dialog .btns{display:flex;justify-content:space-around;padding:0 18px 18px;position:relative;min-height:60px}
.dbtn{font-family:var(--mono);font-size:24px;border:3px solid var(--ink);background:#eee;padding:4px 26px;box-shadow:inset -3px -3px 0 #bbb;position:relative;transition:transform .15s}

/* floating controls */
.corner{position:absolute;top:10px;right:10px;display:flex;gap:8px;z-index:5}
.corner button{width:40px;height:40px;border:3px solid var(--ink);border-radius:10px;background:var(--panel);font-family:var(--display);font-size:12px;display:grid;place-items:center}
.corner button[aria-pressed="true"]{background:var(--mint)}
.corner .gear{background:var(--butter)}

/* admin */
.modal{position:fixed;inset:0;background:rgba(91,42,74,.7);z-index:60;display:grid;place-items:start center;overflow-y:auto;padding:max(16px, env(safe-area-inset-top, 0px)) 16px 40px}
.sheet{background:var(--panel);border:4px solid var(--ink);border-radius:16px;width:100%;max-width:720px;box-shadow:0 8px 0 var(--ink)}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:4px solid var(--ink);background:var(--butter);border-radius:12px 12px 0 0}
.sheet header h2{font-family:var(--display);font-size:12px;margin:0;line-height:1.6}
.x{border:3px solid var(--ink);background:#fff;border-radius:8px;width:36px;height:36px;font-family:var(--display);font-size:12px}
.tabs{display:flex;gap:6px;padding:12px 16px 0;flex-wrap:wrap}
.tab{font-family:var(--display);font-size:9px;border:3px solid var(--ink);border-radius:8px;padding:9px 10px;background:#fff}
.tab[aria-selected="true"]{background:var(--accent2)}
.pane{padding:16px;display:grid;gap:14px}
.field{display:grid;gap:4px}
.field label,.lbl{font-family:var(--display);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);line-height:1.6}
.field input[type=text],.field input[type=date],.field textarea{font:inherit;font-size:16px;border:3px solid var(--ink);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);width:100%}
.field textarea{min-height:140px;resize:vertical;line-height:1.45}
.help{font-size:14px;color:var(--ink2);margin:0}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.upload{display:flex;align-items:center;justify-content:center;gap:10px;border:3px dashed var(--ink);border-radius:12px;padding:16px;background:#fff;font-family:var(--display);font-size:10px;cursor:pointer;text-align:center;line-height:1.6}
.upload:hover{background:var(--butter)}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.items{display:grid;gap:10px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;border:3px solid var(--ink);border-radius:10px;padding:8px;background:#fff}
.item img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:2px solid var(--ink)}
.item .ico{width:64px;height:48px;display:grid;place-items:center;font-family:var(--display);font-size:10px;background:var(--lilac);border:2px solid var(--ink);border-radius:6px}
.item input[type=text]{font:inherit;font-size:15px;border:2px solid var(--ink);border-radius:8px;padding:6px 8px;width:100%;min-width:0}
.item audio{width:100%;height:32px;margin-top:4px}
.del{border:3px solid var(--ink);background:#fff;border-radius:8px;font-family:var(--display);font-size:9px;padding:8px}
.del:hover{background:var(--accent2)}
.savebar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-top:4px solid var(--ink);background:var(--panel);border-radius:0 0 12px 12px}
.meter{flex:1 1 200px;font-family:var(--mono);font-size:19px}
.meter .bar{margin-top:2px}
.meter.warn .bar i{background:#FF9A3C}
.meter.full .bar i{background:#D9304F}
.save{font-family:var(--display);font-size:11px;border:4px solid var(--ink);border-radius:12px;padding:14px 18px;background:var(--mint);box-shadow:0 4px 0 var(--ink)}
.save[disabled]{opacity:.5;cursor:wait}
.status{font-family:var(--mono);font-size:19px;width:100%;margin:0;line-height:1.2}

#fx{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}

@media (max-width:520px){
  .screen{padding:18px 14px 22px}
  .sprites canvas{width:60px;height:84px}
  .tape{grid-template-columns:1fr auto}
  .tape .reels{display:none}
  .level{grid-template-columns:52px 1fr}
}
@media (max-width:420px){
  /* el boton de musica va absoluto sobre la barra: hay que reservarle el hueco
     o un apodo largo queda tapado debajo */
  .topbar{padding:12px 52px 10px 12px}
  .pill{font-size:9px;padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

#yt-wrap{position:fixed;left:-9999px;top:0;width:200px;height:200px;overflow:hidden}
</style>
</head>
<body>
<template id="tpl">
<main class="console" id="console">
  <div class="topbar">
    <span class="pill" data-p1>Player 1</span>
    <canvas class="heart" width="7" height="6" data-heart></canvas>
    <span class="pill" data-p2>Player 2</span>
  </div>

  <div class="corner">
    <button type="button" id="music-btn" aria-pressed="false" aria-label="Música de fondo" title="Música">♪</button>
  </div>

  <!-- TITLE -->
  <section class="screen" id="s-title">
    <div class="clouds" aria-hidden="true">
      <span class="cloud" style="top:70px;animation-delay:-4s"></span>
      <span class="cloud" style="top:170px;animation-delay:-20s;transform:scale(.8)"></span>
      <span class="cloud" style="top:300px;animation-delay:-30s"></span>
      <span class="sparkle" style="left:8%;top:40%">+</span>
      <span class="sparkle" style="right:10%;top:22%;animation-delay:.6s">+</span>
      <span class="sparkle" style="left:22%;top:14%;animation-delay:1.2s">·</span>
      <span class="sparkle" style="right:26%;top:62%;animation-delay:.3s">+</span>
    </div>
    <div class="title-wrap">
      <div class="logo-small">— un juego de dos jugadores —</div>
      <h1 class="logo" data-title>Nuestra <em>Partida</em></h1>
      <button type="button" class="start" id="start-btn"><span class="tri"></span><span class="blink">PRESS START</span></button>
      <div class="warning">⚠ Advertencia: puede causar mariposas y sonrisas sin razón</div>
      <div class="sprites">
        <canvas width="10" height="14" data-sprite="boy" aria-hidden="true"></canvas>
        <div class="mid" data-since-short></div>
        <canvas width="10" height="14" data-sprite="girl" aria-hidden="true"></canvas>
      </div>
      <div class="arcade" aria-hidden="true">
        <i style="background:#FF8FA3"></i><i style="background:var(--butter)"></i><i style="background:var(--mint)"></i>
        <span style="width:40px"></span>
        <i style="background:#FF8FA3"></i><i style="background:var(--butter)"></i><i style="background:var(--mint)"></i>
      </div>
    </div>
  </section>

  <!-- MENU -->
  <section class="screen" id="s-menu" hidden>
    <h2 class="screen-title">Selecciona un nivel</h2>
    <p class="lead">Cada nivel guarda un pedacito de nosotros. Completa los cinco para desbloquear el final.</p>
    <div class="hud">
      <div class="stat"><div class="k">Días juntos</div><div class="v" id="days">—</div></div>
      <div class="stat"><div class="k">Tiempo en partida</div><div class="v" id="clock"><small>—</small></div></div>
      <div class="stat"><div class="k">HP de amor</div><div class="hp" id="hp"></div><div class="v" style="font-size:22px">∞ / ∞</div></div>
    </div>
    <div class="levels" id="levels"></div>
    <button type="button" class="final-btn" id="final-btn" disabled>🔒 Final bloqueado · 0/5</button>
  </section>

  <!-- LEVEL: PHOTOS -->
  <section class="screen" id="s-photos" hidden>
    <button type="button" class="back" data-back>◀ Menú</button>
    <h2 class="screen-title">Nivel 1 · Recuerdos</h2>
    <p class="lead">Toca una foto para verla en grande.</p>
    <div class="gallery" id="gallery"></div>
  </section>

  <!-- LEVEL: VOICES -->
  <section class="screen" id="s-voices" hidden>
    <button type="button" class="back" data-back>◀ Menú</button>
    <h2 class="screen-title">Nivel 2 · Mensajes de voz</h2>
    <p class="lead">Ponte audífonos. La música baja sola mientras escuchas.</p>
    <div class="tapes" id="tapes"></div>
  </section>

  <!-- LEVEL: LETTER -->
  <section class="screen" id="s-letter" hidden>
    <button type="button" class="back" data-back>◀ Menú</button>
    <h2 class="screen-title">Nivel 3 · La carta</h2>
    <div class="letter-stage">
      <button type="button" class="envelope" id="envelope" aria-label="Abrir la carta">
        <canvas class="seal" width="7" height="6" data-heart></canvas>
      </button>
      <div class="envelope-label blink" id="env-label">Toca el sobre</div>
      <div class="paper" id="paper" hidden></div>
      <button type="button" class="skip" id="skip" hidden>Mostrar todo</button>
    </div>
  </section>

  <!-- LEVEL: REASONS -->
  <section class="screen" id="s-reasons" hidden>
    <button type="button" class="back" data-back>◀ Menú</button>
    <h2 class="screen-title">Nivel 4 · Razones</h2>
    <p class="lead">Cada cápsula guarda una razón por la que te amo. Ábrelas todas.</p>
    <div class="counter" id="caps-count"></div>
    <div class="capsules" id="capsules"></div>
  </section>

  <!-- LEVEL: CAKE -->
  <section class="screen" id="s-cake" hidden>
    <button type="button" class="back" data-back>◀ Menú</button>
    <h2 class="screen-title">Nivel 5 · Pide un deseo</h2>
    <div class="cake-stage">
      <p class="lead" id="cake-lead">Cierra los ojos, pide un deseo y apaga las velas tocándolas.</p>
      <div class="cake" aria-label="Pastel">
        <div class="candles" id="candles"></div>
        <div class="tier t1"></div>
        <div class="tier t2"></div>
        <div class="plate"></div>
      </div>
      <div id="cake-done" hidden>
        <p class="bday" id="bday-title"></p>
        <div class="wish" id="wish"></div>
      </div>
    </div>
  </section>

  <!-- END -->
  <section class="screen" id="s-end" hidden>
    <button type="button" class="back" data-back style="justify-self:start">◀ Menú</button>
    <p class="gc">¡Juego completado!</p>
    <div class="finale" id="finale"></div>
    <div class="dialog" role="dialog" aria-label="Pregunta final">
      <div class="bar2" aria-hidden="true"><i></i><i></i></div>
      <div class="body"><canvas width="7" height="6" data-heart></canvas><span>¿Jugamos otra partida…<br>para siempre?</span></div>
      <div class="btns" id="yn">
        <button type="button" class="dbtn" id="yes">Sí</button>
        <button type="button" class="dbtn" id="no">No</button>
      </div>
    </div>
    <p class="lead" id="yes-msg" hidden style="font-family:var(--display);font-size:12px;line-height:1.8;color:var(--accent)">Respuesta guardada para siempre ♥</p>
  </section>
</main>

<div class="lightbox" id="lightbox" hidden><figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure></div>

<canvas id="fx"></canvas>
<audio id="bgm" loop preload="auto"></audio>
<div id="yt-wrap" aria-hidden="true"><div id="yt"></div></div>
<audio id="voice" preload="none"></audio>
</template>
<script src="config.js"></script>
<script>
(function boot(){
"use strict";
if(!document.body){document.addEventListener("DOMContentLoaded",boot);return}
var FONT_LINK='<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;700&family=VT323&display=swap">';
var MAX_TOTAL=15*1024*1024, WARN_TOTAL=12*1024*1024;
var STATE=window.CONFIG||{};STATE.photos=STATE.fotos||[];STATE.voices=STATE.audios||[];STATE.reasons=STATE.razones||[];STATE.letter=STATE.carta||'';STATE.sign=STATE.firma||'';STATE.bday=STATE.tituloPastel||'';STATE.wish=STATE.mensajePastel||'';STATE.finale=STATE.mensajeFinal||'';STATE.since=STATE.juntosDesde||'';STATE.title=STATE.titulo||'Nuestra Partida';
document.body.appendChild(document.getElementById('tpl').content.cloneNode(true));

var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function store(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k)||'null')}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

/* ---------- pixel art ---------- */
var PAL={H:'#3a2330',S:'#ffd9c2',E:'#3a2330',M:'#ff6f9f',C:'#ffa3c4',P:'#c8a8ff',D:'#ff8fc0',B:'#5b4a7a',K:'#5b2a4a',R:'#ff4f8b',W:'#ffffff',X:'#5b2a4a'};
var SPR={
 heart:['.XX.XX.','XRWRRRX','XRRRRRX','.XRRRX.','..XRX..','...X...'],
 heartGrey:['.XX.XX.','XWWWWWX','XWWWWWX','.XWWWX.','..XWX..','...X...'],
 boy:['..HHHHHH..','.HHHHHHHH.','.HSSSSSSH.','.SSESSESS.','.SCSSSSCS.','..SSMMSS..','...SSSS...','..PPPPPP..','.PPPPPPPP.','SPPPPPPPPS','S.PPPPPP.S','..BBBBBB..','..BB..BB..','..KK..KK..'],
 girl:['..HHHHHH..','.HHHHHHHH.','HHSSSSSSHH','HSSESSESSH','HSCSSSSCSH','HHSSMMSSHH','HH.SSSS.HH','H.DDDDDD.H','.DDDDDDDD.','SDDDDDDDDS','..DDDDDD..','.DDDDDDDD.','...SS.SS..','...KK.KK..']
};
function draw(c,map){var g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);map.forEach(function(row,y){for(var x=0;x<row.length;x++){var ch=row[x];if(ch==='.')continue;g.fillStyle=PAL[ch]||'#000';g.fillRect(x,y,1,1)}})}
function paintSprites(root){$$('canvas[data-heart]',root).forEach(function(c){draw(c,SPR.heart)});$$('canvas[data-sprite]',root).forEach(function(c){draw(c,SPR[c.dataset.sprite])})}

/* ---------- render from state ---------- */
var LEVELS=[
 {id:'photos',name:'Recuerdos',sub:'Nuestras fotos juntos',c:'var(--mint)'},
 {id:'voices',name:'Mensajes de voz',sub:'Audios que grabé para ti',c:'var(--lilac)'},
 {id:'letter',name:'La carta',sub:'Ábrela despacio',c:'var(--butter)'},
 {id:'reasons',name:'Razones',sub:'Por qué te amo',c:'var(--sky)'},
 {id:'cake',name:'Pide un deseo',sub:'Nivel cumpleaños',c:'var(--accent2)'}
];
var visited=store('np-visited')||{};
var isAdmin=false;

function titleHTML(t){t=String(t||'Nuestra Partida').trim();var i=t.lastIndexOf(' ');if(i<1)return '<em>'+esc(t)+'</em>';return esc(t.slice(0,i))+' <em>'+esc(t.slice(i+1))+'</em>'}
function sinceDate(){if(!STATE.since)return null;var p=STATE.since.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);return isNaN(d)?null:d}

function renderAll(){
 $$('[data-p1]').forEach(function(e){e.textContent=STATE.p1||'Player 1'});
 $$('[data-p2]').forEach(function(e){e.textContent=STATE.p2||'Player 2'});
 $('[data-title]').innerHTML=titleHTML(STATE.title);
 document.title=STATE.title||'Nuestra Partida';
 var d=sinceDate();
 $('[data-since-short]').innerHTML=d?('desde<br>'+d.toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'})):'♥';
 renderMenu();renderGallery();renderTapes();renderCapsules();renderCandles();
}

function renderMenu(){
 var box=$('#levels');box.innerHTML='';
 LEVELS.forEach(function(L,i){
  var b=document.createElement('button');b.type='button';b.className='level';
  b.innerHTML='<span class="num" style="background:'+L.c+'">'+(i+1)+'</span><span class="txt"><div class="name">'+esc(L.name)+'</div><div class="sub">'+esc(L.sub)+'</div>'+(visited[L.id]?'<span class="badge">★ completado</span>':'')+'</span>';
  b.addEventListener('click',function(){openLevel(L.id)});box.appendChild(b);
 });
 var n=LEVELS.filter(function(L){return visited[L.id]}).length;
 var fb=$('#final-btn');fb.disabled=n<LEVELS.length;
 fb.textContent=n<LEVELS.length?('🔒 Final bloqueado · '+n+'/'+LEVELS.length):'♥ Final desbloqueado · jugar';
 var hp=$('#hp');if(!hp.childElementCount){for(var k=0;k<5;k++){var c=document.createElement('canvas');c.width=7;c.height=6;draw(c,SPR.heart);hp.appendChild(c)}}
 tick();
}
function pad(n,l){n=String(n);while(n.length<(l||2))n='0'+n;return n}
function tick(){
 var d=sinceDate();
 if(!d){$('#days').innerHTML='<small>'+(false?'pon la fecha en config.js':'∞')+'</small>';$('#clock').innerHTML='<small>desde siempre</small>';return}
 var ms=Date.now()-d.getTime();if(ms<0)ms=0;
 var days=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
 $('#days').textContent=days.toLocaleString('es');
 $('#clock').textContent=pad(h)+':'+pad(m)+':'+pad(s);
}
setInterval(tick,1000);

function renderGallery(){
 var g=$('#gallery');g.innerHTML='';
 if(!STATE.photos.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">'+(false?'Aún no hay fotos. Súbelas en config.js.':'Las fotos están cargando en otra dimensión… vuelve pronto ♥')+'</div>';return}
 STATE.photos.forEach(function(p,i){
  var f=document.createElement('button');f.type='button';f.className='polaroid';f.style.setProperty('--r',((i*37)%9-4)+'deg');
  f.innerHTML='<img alt="'+esc(p.caption||'Foto')+'" src="'+p.src+'"><p>'+esc(p.caption||'')+'</p>';
  f.addEventListener('click',function(){$('#lb-img').src=p.src;$('#lb-img').alt=p.caption||'';$('#lb-cap').textContent=p.caption||'';$('#lightbox').hidden=false});
  g.appendChild(f);
 });
}
$('#lightbox').addEventListener('click',function(){this.hidden=true});

/* ---------- audio ---------- */
var bgm=$('#bgm'),voice=$('#voice'),musicOn=false,BGV=55,yt=null,ytReady=false,wantPlay=false;
function ytId(u){if(!u)return null;var m=String(u).match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);return m?m[1]:(/^[A-Za-z0-9_-]{11}$/.test(u)?u:null)}
function ytStart(u){var m=String(u||'').match(/[?&]t=(\d+)/);return m?+m[1]:0}
var VID=ytId(STATE.youtube);
if(VID){
 window.onYouTubeIframeAPIReady=function(){
  yt=new YT.Player('yt',{width:200,height:200,videoId:VID,playerVars:{autoplay:0,controls:0,loop:1,playlist:VID,playsinline:1,start:ytStart(STATE.youtube)},
   events:{onReady:function(){ytReady=true;yt.setVolume(BGV);if(wantPlay)yt.playVideo()}}});
 };
 var tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
}else if(STATE.cancionMp3){bgm.src=STATE.cancionMp3;bgm.volume=BGV/100}
function hasMusic(){return !!VID||!!STATE.cancionMp3}
function setMusic(on){
 musicOn=on&&hasMusic();$('#music-btn').setAttribute('aria-pressed',String(musicOn));
 if(VID){wantPlay=musicOn;if(ytReady){musicOn?yt.playVideo():yt.pauseVideo()}}
 else{if(musicOn){var p=bgm.play();if(p&&p.catch)p.catch(function(){})}else bgm.pause()}
}
$('#music-btn').addEventListener('click',function(){setMusic(!musicOn)});
function setVol(v){if(VID){if(ytReady)yt.setVolume(v)}else bgm.volume=v/100}
function duck(on){setVol(on?8:BGV)}

var currentTape=null;
function renderTapes(){
 var t=$('#tapes');t.innerHTML='';
 if(!STATE.voices.length){t.innerHTML='<div class="empty">'+(false?'Aún no hay audios. Grábalos en tu celular y súbelos en config.js.':'Los mensajes de voz están por llegar ♥')+'</div>';return}
 STATE.voices.forEach(function(v){
  var el=document.createElement('div');el.className='tape';
  el.innerHTML='<div class="reels" aria-hidden="true"><span></span><span></span></div><div><div class="t">'+esc(v.title||'Mensaje')+'</div><div class="d">'+esc(v.date||'')+'</div><div class="bar"><i></i></div></div><button type="button" class="play" aria-label="Reproducir">▶</button>';
  var btn=$('.play',el),bar=$('.bar i',el);
  btn.addEventListener('click',function(){
   if(currentTape&&currentTape.el===el&&!voice.paused){voice.pause();return}
   if(currentTape){currentTape.el.classList.remove('playing');$('.play',currentTape.el).textContent='▶'}
   currentTape={el:el,bar:bar};voice.src=v.src;voice.play().catch(function(){});
  });
  t.appendChild(el);
 });
}
voice.addEventListener('play',function(){if(currentTape){currentTape.el.classList.add('playing');$('.play',currentTape.el).textContent='❚❚'}duck(true)});
voice.addEventListener('pause',function(){if(currentTape){currentTape.el.classList.remove('playing');$('.play',currentTape.el).textContent='▶'}duck(false)});
voice.addEventListener('ended',function(){if(currentTape)currentTape.bar.style.width='100%'});
voice.addEventListener('timeupdate',function(){if(currentTape&&voice.duration)currentTape.bar.style.width=(voice.currentTime/voice.duration*100)+'%'});

/* ---------- letter ---------- */
var typing=null;
function resetLetter(){clearTimeout(typing);$('#paper').hidden=true;$('#skip').hidden=true;$('#envelope').hidden=false;$('#env-label').hidden=false}
function letterHTML(n){var txt=STATE.letter||'';return esc(txt.slice(0,n))}
function finishLetter(){clearTimeout(typing);$('#paper').innerHTML=letterHTML(Infinity)+'<span class="sig">— '+esc(STATE.sign||STATE.p1||'')+'</span>';$('#skip').hidden=true}
$('#envelope').addEventListener('click',function(){
 this.hidden=true;$('#env-label').hidden=true;$('#paper').hidden=false;burst(40);
 if(reduce){finishLetter();return}
 $('#skip').hidden=false;var i=0,txt=STATE.letter||'';
 (function step(){i+=1;$('#paper').innerHTML=letterHTML(i)+'<span class="caret"></span>';if(i<txt.length){var ch=txt[i-1];typing=setTimeout(step,/[.,!?\n]/.test(ch)?160:32)}else finishLetter()})();
});
$('#skip').addEventListener('click',finishLetter);

/* ---------- reasons ---------- */
var CAPC=['var(--accent2)','var(--mint)','var(--butter)','var(--lilac)','var(--sky)'];
function renderCapsules(){
 var box=$('#capsules');box.innerHTML='';var list=(STATE.reasons||[]).filter(Boolean),opened=0;
 function count(){$('#caps-count').textContent='Abiertas: '+opened+' / '+list.length;if(opened===list.length&&list.length)burst(80)}
 if(!list.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">Las razones son tantas que no cupieron aquí… todavía.</div>';$('#caps-count').textContent='';return}
 list.forEach(function(r,i){
  var b=document.createElement('button');b.type='button';b.className='capsule';b.style.setProperty('--c',CAPC[i%CAPC.length]);
  b.innerHTML='<span class="q">?</span>';b.setAttribute('aria-label','Abrir razón '+(i+1));
  b.addEventListener('click',function(){if(b.classList.contains('open'))return;b.classList.add('open');b.innerHTML='<span class="r">'+esc(r)+'</span>';opened++;count()});
  box.appendChild(b);
 });
 count();
}

/* ---------- cake ---------- */
function renderCandles(){
 var box=$('#candles');box.innerHTML='';var left=5;$('#cake-done').hidden=true;$('#cake-lead').hidden=false;
 for(var i=0;i<5;i++){(function(){
  var c=document.createElement('button');c.type='button';c.className='candle';c.setAttribute('aria-label','Apagar vela');c.innerHTML='<span class="flame"></span>';
  c.addEventListener('click',function(){if(c.classList.contains('out'))return;c.classList.add('out');left--;if(!left){$('#cake-lead').hidden=true;$('#bday-title').textContent=STATE.bday||'¡Feliz cumpleaños!';$('#wish').textContent=STATE.wish||'';$('#cake-done').hidden=false;burst(160)}});
  box.appendChild(c)})()}
}

/* ---------- navigation ---------- */
var SCREENS=['title','menu','photos','voices','letter','reasons','cake','end'];
function show(id){SCREENS.forEach(function(s){$('#s-'+s).hidden=s!==id});$('#console').scrollIntoView({block:'start',behavior:reduce?'auto':'smooth'})}
function openLevel(id){
 visited[id]=true;store('np-visited',visited);
 if(id==='letter')resetLetter();
 if(id==='reasons')renderCapsules();
 if(id==='cake')renderCandles();
 show(id);
}
$$('[data-back]').forEach(function(b){b.addEventListener('click',function(){if(!voice.paused)voice.pause();renderMenu();show('menu')})});
$('#start-btn').addEventListener('click',function(){setMusic(true);burst(50);renderMenu();show('menu')});
$('#final-btn').addEventListener('click',function(){if(this.disabled)return;$('#finale').textContent=STATE.finale||'';$('#yes-msg').hidden=true;show('end');burst(120)});

/* runaway "No" */
var no=$('#no');
function flee(e){if(e)e.preventDefault();var box=$('#yn').getBoundingClientRect(),w=no.offsetWidth,h=no.offsetHeight;
 var x=Math.random()*(box.width-w)-(no.offsetLeft),y=(Math.random()-.5)*50;no.style.transform='translate('+x+'px,'+y+'px) scale('+(.6+Math.random()*.3)+')';
 var yes=$('#yes');var s=parseFloat(yes.dataset.s||'1')+.12;yes.dataset.s=s;yes.style.transform='scale('+Math.min(s,1.8)+')'}
no.addEventListener('mouseenter',flee);no.addEventListener('touchstart',flee,{passive:false});no.addEventListener('click',flee);
$('#yes').addEventListener('click',function(){$('#yes-msg').hidden=false;burst(220,true)});

/* ---------- confetti ---------- */
var fx=$('#fx'),g=fx.getContext('2d'),parts=[],running=false;
var FXC=['#FF6FA8','#FF9CC5','#A8E6CF','#FFE59A','#CDB4FF','#BFE3FF'];
function burst(n,hearts){
 if(reduce)return;fx.width=innerWidth;fx.height=innerHeight;
 for(var i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.6,y:innerHeight*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:4+Math.random()*6|0,c:FXC[i%FXC.length],l:90+Math.random()*60,h:hearts&&i%3===0});
 if(!running){running=true;requestAnimationFrame(loop)}
}
function loop(){
 g.clearRect(0,0,fx.width,fx.height);
 parts=parts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.99;p.l--;
  if(p.h){g.save();g.translate(p.x|0,p.y|0);g.scale(3,3);SPR.heart.forEach(function(r,y){for(var x=0;x<r.length;x++)if(r[x]!=='.'){g.fillStyle=PAL[r[x]];g.fillRect(x,y,1,1)}});g.restore()}
  else{g.fillStyle=p.c;g.fillRect(p.x|0,p.y|0,p.s,p.s)}
  return p.l>0&&p.y<fx.height+20});
 if(parts.length)requestAnimationFrame(loop);else{running=false;g.clearRect(0,0,fx.width,fx.height)}
}

/* ---------- boot ---------- */
paintSprites(document);renderAll();
})();
</script>
</body>
</html>
